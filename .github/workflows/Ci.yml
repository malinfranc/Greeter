# ETAPE 1 : la CI la plus simple possible
# A chaque push, GitHub loue une machine Ubuntu, recupere le code,
# puis execute les memes commandes que vous tapez dans votre terminal.
name: CI

on: 
  push:
     branches: [master]   # NOUVEAU
  pull_request:          # NOUVEAU


jobs:
  # ==========================================================================
  # CI (Integration Continue) : verifier chaque changement
  # ==========================================================================

  build-and-test:
    name: CI - Compiler et tester (${{ matrix.os }})   # MODIFIE : un nom par systeme
    strategy:                                   # NOUVEAU
      fail-fast: false                          # NOUVEAU : ne pas arreter Windows si Linux echoue
      matrix:                                   # NOUVEAU
        os: [ubuntu-latest, windows-latest]     # NOUVEAU
    runs-on: ${{ matrix.os }}                   # MODIFIE

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer (cmake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --config Release                   # MODIFIE

      - name: Tester (ctest)
        run: ctest --test-dir build -C Release --output-on-failure  # MODIFIE

      - name: Installer et lancer le programme
        run: |
          cmake --install build --prefix install
          ./install/bin/greet Alice

  docker:
      name: CI - Image Docker
      # On ne construit l'image que si les tests passent
      needs: build-and-test
      runs-on: ubuntu-latest

      steps:
        - name: Recuperer le code
          uses: actions/checkout@v4

        - name: Construire l'image
          run: docker build -t greeter .

        - name: Lancer l'image
          run: docker run --rm greeter


